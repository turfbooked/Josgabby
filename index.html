<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Josh &amp; Gabby: Our Story</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b1a3f;--rose:#ff6b8b;--cream:#fff1d6;--gold:#ffd166;--sky:#8fd3ff;--grass:#6fbf73;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#2b1a3f;--rose:#ff6b8b;--cream:#fff1d6;--gold:#ffd166}}
:root[data-theme="dark"]{--ink:#2b1a3f;--rose:#ff6b8b;--cream:#fff1d6;--gold:#ffd166}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--ink);color:var(--cream);font:400 18px/1.35 'Pixelify Sans','Courier New',monospace;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ink);z-index:10}
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;z-index:0}
#app{position:relative;height:100%;z-index:1}
.s{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center;overflow-y:auto}
.s.on{display:flex}
h1{margin:0;font-size:clamp(34px,11vw,56px);line-height:1;color:var(--gold);text-shadow:0 4px 0 #7a2f6e}
p{margin:0;max-width:34ch}
button{font:700 18px 'Pixelify Sans','Courier New',monospace;color:var(--ink);background:var(--gold);border:3px solid var(--ink);box-shadow:0 5px 0 #b3862a,0 0 0 3px var(--cream);padding:10px 22px;border-radius:6px;cursor:pointer}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #b3862a,0 0 0 3px var(--cream)}
button:focus-visible{outline:3px solid var(--sky);outline-offset:4px}
button:disabled{background:#6d5a85;box-shadow:0 5px 0 #46345c,0 0 0 3px #8d7aa5;color:#2b1a3f99;cursor:not-allowed}
.ph{display:block;position:relative;width:132px;height:150px;background:#fff;padding:8px 8px 26px;box-shadow:0 6px 0 #0004;transform:rotate(-3deg);cursor:pointer;color:var(--ink);box-sizing:border-box}
.phw:nth-child(2) .ph{transform:rotate(2deg)}
.ph input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{display:flex;height:100%;align-items:center;justify-content:center;background:#ffd9e2;font-size:14px;padding:6px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#lv{display:flex;flex-direction:column;gap:12px;width:min(100%,360px);padding:6px 6px 20px}
.lvb{display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.lvb b{background:var(--ink);color:var(--gold);border-radius:4px;padding:0 9px}
.lvb.done::after{content:"\2665";margin-left:auto;color:#d6204b}
#stage{position:relative;width:min(100%,560px)}
#cv{width:100%;aspect-ratio:16/9;image-rendering:pixelated;border:4px solid var(--cream);border-radius:6px;display:block;background:#000}
#hint{position:absolute;left:0;right:0;top:8px;font-size:14px;color:var(--ink);text-shadow:0 1px 0 #fff8}
#win{position:absolute;inset:4px;background:#2b1a3fcc;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#win.on{display:flex}
#dlg{width:min(100%,560px);min-height:96px;background:var(--cream);color:var(--ink);border:4px solid var(--ink);box-shadow:0 0 0 3px var(--cream),0 5px 0 3px #0006;border-radius:6px;padding:10px 12px;text-align:left;font-size:18px;box-sizing:border-box;cursor:pointer}
#pad{display:flex;gap:14px;align-items:center;justify-content:center;touch-action:none}
#pad button{min-width:66px;min-height:62px;font-size:24px;padding:6px 14px}
#pad #A{border-radius:50%;background:var(--rose);min-width:68px}
#big{font-size:clamp(30px,9vw,46px);color:var(--gold);min-height:2.6em}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pol{margin:0;background:#fff;padding:8px 8px 24px;box-shadow:0 6px 0 #0005;transform:rotate(-3deg);width:min(62vw,220px);box-sizing:border-box}.pol.lg{width:min(84vw,320px)}.pol img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}.wall{display:flex;flex-wrap:wrap;gap:18px 12px;justify-content:center;width:min(100%,400px)}.wall .pol{width:calc(50% - 8px);transform:rotate(2deg)}.wall .pol:nth-child(even){transform:rotate(-2.5deg)}.wall .pol.w{width:100%;transform:rotate(1deg)}
</style></head><body>
