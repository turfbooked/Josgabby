<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pokémon Red: Josh & Gabby Version</title>
  <!-- Retro 8-bit Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    :root {
      --gbc-darkest: #0f380f;
      --gbc-dark: #306230;
      --gbc-light: #8bac0f;
      --gbc-lightest: #9bbc0f;
      --case-red: #c02626;
      --case-red-dark: #8c1313;
      --ui-border: #2b2b2b;
      --gold: #f59e0b;
      --pink: #ec4899;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      margin: 0;
      padding: 0;
    }

    body {
      background: #111827;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Press Start 2P', monospace, sans-serif;
      padding: 10px;
      color: #fff;
    }

    /* Game Boy Shell Outer Case */
    .gameboy-device {
      background: linear-gradient(145deg, #dc2626, #991b1b);
      width: 100%;
      max-width: 440px;
      border-radius: 24px 24px 50px 24px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.7), inset 0 3px 6px rgba(255,255,255,0.3);
      padding: 20px 18px 28px 18px;
      position: relative;
      border-bottom: 8px solid #7f1d1d;
    }

    /* Top Curved Accent Lines */
    .gb-accents {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 8px;
    }
    .gb-label {
      font-size: 8px;
      letter-spacing: 2px;
      color: #fca5a5;
      font-weight: bold;
    }
    .power-led {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #4ade80;
    }

    /* Screen Bezel */
    .screen-bezel {
      background: #374151;
      border-radius: 12px 12px 35px 12px;
      padding: 14px;
      box-shadow: inset 0 4px 8px rgba(0,0,0,0.6);
      border: 3px solid #1f2937;
    }

    /* Retro LCD Screen */
    .screen-lcd {
      background: #8bac0f;
      border: 3px solid #0f380f;
      border-radius: 6px;
      height: 380px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: inset 0 0 16px rgba(15, 56, 15, 0.4);
    }

    /* Scanline overlay */
    .screen-lcd::after {
      content: " ";
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.12) 50%);
      background-size: 100% 3px;
      pointer-events: none;
      z-index: 50;
    }

    /* Screen Views */
    .view {
      display: none;
      height: 100%;
      width: 100%;
      flex-direction: column;
      position: relative;
      z-index: 10;
    }
    .view.active {
      display: flex;
    }

    /* Title Screen */
    #title-view {
      align-items: center;
      justify-content: space-around;
      text-align: center;
      padding: 20px 10px;
      color: #0f380f;
    }
    .title-logo {
      font-size: 16px;
      line-height: 1.4;
      text-shadow: 2px 2px #9bbc0f;
      animation: pulse 1.8s infinite;
    }
    .edition-tag {
      background: #0f380f;
      color: #9bbc0f;
      padding: 4px 8px;
      font-size: 9px;
      margin-top: 5px;
      display: inline-block;
    }
    .pixel-couple-preview {
      display: flex;
      gap: 16px;
      align-items: center;
      margin: 15px 0;
    }

    /* Level Hub Map View */
    #hub-view {
      padding: 10px;
      color: #0f380f;
    }
    .hub-header {
      font-size: 8px;
      text-align: center;
      border-bottom: 2px dashed #0f380f;
      padding-bottom: 6px;
      margin-bottom: 8px;
    }
    .chapter-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      overflow-y: auto;
      max-height: 290px;
      padding-right: 2px;
    }
    .chapter-card {
      background: #9bbc0f;
      border: 2px solid #0f380f;
      padding: 7px;
      font-size: 7.5px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.15s;
    }
    .chapter-card.selected {
      background: #0f380f;
      color: #9bbc0f;
      transform: translateX(4px);
    }
    .badge-icon {
      font-size: 11px;
    }

    /* Story / Battle Stage View */
    #story-view {
      display: flex;
      flex-direction: column;
      height: 100%;
      justify-content: space-between;
    }
    .battle-scene {
      height: 215px;
      position: relative;
      background: #9bbc0f;
      border-bottom: 3px solid #0f380f;
      overflow: hidden;
    }

    /* Sprites & Cutscenes */
    .sprite {
      position: absolute;
      image-rendering: pixelated;
      transition: transform 0.3s ease;
    }
    .gabby-sprite {
      top: 15px;
      right: 20px;
      width: 64px;
      height: 64px;
    }
    .josh-sprite {
      bottom: 20px;
      left: 20px;
      width: 64px;
      height: 64px;
    }
    .heart-float {
      position: absolute;
      color: #dc2626;
      font-size: 14px;
      animation: floatUp 1.2s infinite;
    }

    /* Dialogue Box */
    .dialogue-box {
      background: #ffffff;
      border: 4px solid #0f380f;
      border-radius: 4px;
      margin: 6px;
      padding: 10px;
      color: #000;
      min-height: 130px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 2px 2px 0px #0f380f;
    }
    .dialogue-author {
      font-size: 8px;
      color: #6b7280;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .dialogue-text {
      font-size: 8.5px;
      line-height: 1.5;
      color: #111;
      min-height: 65px;
      word-break: break-word;
    }
    .dialogue-next {
      align-self: flex-end;
      font-size: 8px;
      animation: blink 0.9s infinite;
      color: #dc2626;
    }

    /* Physical Controls Section */
    .controls-zone {
      margin-top: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
    }

    /* D-PAD */
    .d-pad {
      width: 110px;
      height: 110px;
      position: relative;
    }
    .d-btn {
      position: absolute;
      background: #1f2937;
      border: 2px solid #111827;
      border-radius: 4px;
      box-shadow: 0 4px #000;
      active: translateY(2px);
    }
    .d-btn:active, .d-btn.pressed {
      transform: translateY(2px);
      box-shadow: 0 1px #000;
      background: #374151;
    }
    .d-up { top: 0; left: 37px; width: 36px; height: 38px; }
    .d-down { bottom: 0; left: 37px; width: 36px; height: 38px; }
    .d-left { top: 37px; left: 0; width: 38px; height: 36px; }
    .d-right { top: 37px; right: 0; width: 38px; height: 36px; }
    .d-center {
      position: absolute;
      top: 37px;
      left: 37px;
      width: 36px;
      height: 36px;
      background: #1f2937;
    }

    /* Action Buttons (A & B) */
    .action-group {
      display: flex;
      gap: 16px;
      transform: rotate(-22deg);
      margin-top: -10px;
    }
    .action-btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .round-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #7f1d1d;
      border: 2px solid #450a0a;
      box-shadow: 0 4px #300606;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fca5a5;
      font-size: 11px;
      font-weight: bold;
    }
    .round-btn:active, .round-btn.pressed {
      transform: translateY(3px);
      box-shadow: 0 1px #300606;
      background: #991b1b;
    }
    .btn-label {
      font-size: 7px;
      color: #fecaca;
      font-weight: bold;
    }

    /* Start / Select Buttons */
    .pill-controls {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 15px;
    }
    .pill-btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .pill-btn {
      width: 45px;
      height: 12px;
      background: #475569;
      border-radius: 10px;
      transform: rotate(-25deg);
      border: 1px solid #1e293b;
      box-shadow: 0 2px #0f172a;
      cursor: pointer;
    }
    .pill-btn:active {
      transform: rotate(-25deg) translateY(1px);
      box-shadow: 0 0px #0f172a;
    }
    .pill-label {
      font-size: 7px;
      color: #94a3b8;
      letter-spacing: 1px;
    }

    /* Ending Confetti/Heart FX */
    .heart-burst {
      position: absolute;
      pointer-events: none;
      font-size: 16px;
      animation: explode 1s forwards ease-out;
    }

    /* Keyframe Animations */
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-30px); opacity: 0; }
    }
    @keyframes explode {
      0% { transform: scale(0.3) translate(0, 0); opacity: 1; }
      100% { transform: scale(1.6) translate(var(--dx), var(--dy)); opacity: 0; }
    }
    @keyframes bounceSprite {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .bounce {
      animation: bounceSprite 0.6s infinite;
    }
  </style>
</head>
<body>

  <!-- Game Boy Device Outer Structure -->
  <div class="gameboy-device">
    
    <!-- Top Accents & Status Light -->
    <div class="gb-accents">
      <div style="display:flex; align-items:center; gap:6px;">
        <div class="power-led" id="powerLed"></div>

    <div class="screen-bezel">

            <div class="sprite gabby-sprite" id="gabbySpriteWrap">
              <canvas id="stageGabbyCanvas" width="64" height="64"></canvas>
              <div style="font-size:6.5px; color:#0f380f; text-align:center; font-weight:bold; margin-top:2px;">GABBY Lv.19</div>
            </div>

            <!-- Josh Player / Encounter -->
            <div class="sprite josh-sprite" id="joshSpriteWrap">
              <canvas id="stageJoshCanvas" width="64" height="64"></canvas>

            </div>

          <!-- Dialogue Box -->
          <div class="dialogue-box">

              <div class="dialogue-author" id="dialogueAuthor">NARRATOR</div>

      </div>
    </div>

    <!-- Physical Hardware Controls for Mobile Game Experience -->
    <div class="controls-zone">
      <!-- D-Pad -->
      <div class="d-pad">
        <button class="d-btn d-up" id="btnUp" aria-label="Up"></button>
        <button class="d-btn d-down" id="btnDown" aria-label="Down"></button>

      <!-- Action Buttons A & B -->
      <div class="action-group">

          <button class="round-btn" id="btnB">B</button>

    <!-- Start / Select -->

      </div>

        <button class="pill-btn" id="btnStart"></button>
        <span class="pill-label">START</span>
      </div>
    </div>

  </div>

  <script>
    /* =====================================================================
       1. WEB AUDIO API SYNTHESIZER (8-BIT RETRO CHIPTUNE SOUND EFFECTS)
       ===================================================================== */
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playBeep(freq = 440, type = "square", duration = 0.08, vol = 0.1) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function playSelectSound() {
      initAudio();
      playBeep(620, "square", 0.06, 0.1);
      setTimeout(() => playBeep(880, "square", 0.09, 0.12), 40);
    }

    function playTextTick() {
      initAudio();
      playBeep(340 + Math.random() * 80, "triangle", 0.02, 0.04);
    }

    function playFanfare() {
      initAudio();
      const notes = [440, 554, 659, 880];
      notes.forEach((freq, idx) => {
        setTimeout(() => playBeep(freq, "square", 0.15, 0.15), idx * 120);
      });
    }

    /* =====================================================================
       2. RETRO PIXEL ART GENERATORS (CANVAS SPRITES)
       ===================================================================== */
    // Helper to draw pixel squares
    function drawPixel(ctx, x, y, size, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x * size, y * size, size, size);
    }

    // Draw 8-bit Josh (Grade 6 -> Winnipeg Guy)
    function renderJoshSprite(canvasId, mood = "normal") {
      const c = document.getElementById(canvasId);
      if (!c) return;
      const ctx = c.getContext("2d");
      ctx.clearRect(0,0, c.width, c.height);
      const s = 4; // pixel block size

      // Hair (Dark Brown)
      for(let x=4; x<=9; x++) for(let y=1; y<=3; y++) drawPixel(ctx, x, y, s, "#26150b");
      drawPixel(ctx, 3, 2, s, "#26150b");
      drawPixel(ctx, 10, 2, s, "#26150b");

      // Face (Skin tone)
      for(let x=4; x<=9; x++) for(let y=4; y<=7; y++) drawPixel(ctx, x, y, s, "#e0a370");
      // Eyes
      drawPixel(ctx, 5, 5, s, "#111");
      drawPixel(ctx, 8, 5, s, "#111");
      // Smile / Expression
      if (mood === "inLove") {
        drawPixel(ctx, 6, 7, s, "#b91c1c");
        drawPixel(ctx, 7, 7, s, "#b91c1c");
        // Blush
        drawPixel(ctx, 4, 6, s, "#fca5a5");
        drawPixel(ctx, 9, 6, s, "#fca5a5");
      } else {
        drawPixel(ctx, 6, 7, s, "#3b2214");
        drawPixel(ctx, 7, 7, s, "#3b2214");
      }

      // TVIS Uniform / Red hoodie
      for(let x=3; x<=10; x++) for(let y=8; y<=11; y++) drawPixel(ctx, x, y, s, "#f8fafc"); // White shirt
      // Gray Collar
      drawPixel(ctx, 5, 8, s, "#64748b");
      drawPixel(ctx, 8, 8, s, "#64748b");

      // Pants (Gray TVIS pants)
      for(let x=4; x<=9; x++) for(let y=12; y<=14; y++) drawPixel(ctx, x, y, s, "#475569");
      drawPixel(ctx, 6, 13, s, "#1e293b"); // divide legs
      drawPixel(ctx, 7, 13, s, "#1e293b");
    }

    // Draw 8-bit Gabby (New York / TVIS 7th grader girl)
    function renderGabbySprite(canvasId, mood = "normal") {
      const c = document.getElementById(canvasId);
      if (!c) return;
      const ctx = c.getContext("2d");
      ctx.clearRect(0,0, c.width, c.height);
      const s = 4;

      // Long Hair (Flowing dark waves)
      for(let x=3; x<=10; x++) for(let y=1; y<=4; y++) drawPixel(ctx, x, y, s, "#1f1610");
      for(let y=4; y<=10; y++) {
        drawPixel(ctx, 2, y, s, "#1f1610");
        drawPixel(ctx, 3, y, s, "#1f1610");
        drawPixel(ctx, 10, y, s, "#1f1610");
        drawPixel(ctx, 11, y, s, "#1f1610");
      }

      // Face (Fair tone)
      for(let x=4; x<=9; x++) for(let y=4; y<=7; y++) drawPixel(ctx, x, y, s, "#fcd3b8");
      // Pretty Eyes
      drawPixel(ctx, 5, 5, s, "#0f172a");
      drawPixel(ctx, 8, 5, s, "#0f172a");

      // Warm Smile
      drawPixel(ctx, 6, 7, s, "#e11d48");
      drawPixel(ctx, 7, 7, s, "#e11d48");
      // Cute blush
      drawPixel(ctx, 4, 6, s, "#f43f5e");
      drawPixel(ctx, 9, 6, s, "#f43f5e");

      // TVIS Uniform - White Short-sleeved Shirt
      for(let x=4; x<=9; x++) for(let y=8; y<=10; y++) drawPixel(ctx, x, y, s, "#ffffff");
      // Gray Collar
      drawPixel(ctx, 5, 8, s, "#64748b");
      drawPixel(ctx, 8, 8, s, "#64748b");

      // TVIS Gray Skirt
      for(let x=3; x<=10; x++) for(let y=11; y<=13; y++) drawPixel(ctx, x, y, s, "#475569");
      // Shoes
      drawPixel(ctx, 4, 14, s, "#000");
      drawPixel(ctx, 9, 14, s, "#000");
    }

    /* =====================================================================
       3. STORYLINE CHAPTER DATA & SCRIPT
       ===================================================================== */
    const STORY_CHAPTERS = [
      {
        id: 0,
        title: "STAGE 1: THE TVIS ENCOUNTER",
        badge: "🌸",
        location: "KERALA: THE VILLAGE INTL",
        sceneSummary: "Assemblies, White shirts & Angelic accents",
        dialogues: [
          { author: "Josh", text: "Winnipeg to Kerala... I moved from Canada to India and entered The Village International School in Thodupuzha." },
          { author: "Josh", text: "I wrote the test for 7th grade, but had to sit back in Grade 6. Meanwhile, a girl from Rockland County, New York joined Grade 7." },
          { author: "Josh", text: "During school assembly, tall 12th graders stood right in front of us 6th graders. I couldn't see anything at all..." },
          { author: "Narrator", text: "Suddenly, over the speakers, an unmistakable American accent echoed across the morning ground." },
          { author: "Josh", text: "Her voice sounded like home. An angelic voice. Then I caught a glimpse of her in her TVIS uniform with the gray collar. BOOM. I fell in love right away." },
          { author: "Josh", text: "I was chubby, fat and super shy back then. But every single Sunday at church, I prayed: 'Jesus, please let her be my girl.'" }
        ]
      },
      {
        id: 1,
        title: "STAGE 2: WINNIPEG & MUTUALS",
        badge: "⚡",
        location: "WINNIPEG, CANADA (GRADE 9)",
        sceneSummary: "Lockdown, Glow Up & The Instagram DM",
        dialogues: [
          { author: "Narrator", text: "COVID struck the world. Josh relocated all the way back to Winnipeg, Manitoba." },
          { author: "Josh", text: "In 9th grade, I hit the gym, shed a ton of weight, and got my confidence back. I was talking to girls, living my teenage life." },
          { author: "Josh", text: "Then one random afternoon, completely out of the blue, Gabby popped into my mind. Out of nowhere." },
          { author: "Josh", text: "'Wait... my friend's sister's friend is Gabby!' I raced to check Instagram mutuals, and BAM—there was her account!" },
          { author: "Josh", text: "You have no idea how happy I was. That was hands down the single happiest day of my life." },
          { author: "Josh", text: "I hit follow and sent the legendary DM: 'Hey, you go to TVIS right?' That little text rekindled our entire universe." }
        ]
      },
      {
        id: 2,
        title: "STAGE 3: SITUATIONSHIP WARS",
        badge: "🔥",
        location: "WINNIPEG <---> NEW YORK",
        sceneSummary: "Nicole, 3-Day Departure & Resurrection",
        dialogues: [
          { author: "Narrator", text: "Late nights. Non-stop texting. Nicole got involved. Distance was real, but so was the spark." },
          { author: "Josh", text: "Then Gabby dropped the word: 'We are in a situationship.' It was literally the first time in my life I even heard that word!" },
          { author: "Josh", text: "She'd say 'I love you', but then one day said: 'It's all platonic.' Man, that broke my soul into pieces." },
          { author: "Josh", text: "I went completely silent and took a 3-day gap. And just like Jesus Christ on the third day..." },
          { author: "Josh", text: "Gabriella George rose again in my heart! She came right back, and that was the moment we officially started dating." }
        ]
      },
      {
        id: 3,
        title: "STAGE 4: 4 YEARS (6 IN TRUTH)",
        badge: "🛡️",
        location: "DISTANCE & BATTLES",
        sceneSummary: "Arguments, Growth & Enduring Love",
        dialogues: [
          { author: "Narrator", text: "Publicly they tell people 'It's been 4 years'. But between them? It's been 6 intense, beautiful years of history." },
          { author: "Josh", text: "Long-distance relationships aren't for the weak. We've had crazy arguments, heated fights, tears, and bad days." },
          { author: "Josh", text: "Every uphill had a downhill, but through every single storm, we fought FOR each other, never against each other." },
          { author: "Gabby", text: "'At the end of the day, no one gets me the way you do, Josh.'" }
        ]
      },
      {
        id: 4,
        title: "STAGE 5: 2026 & FOREVER",
        badge: "👑",
        location: "PRESENT DAY - TURNING 20",
        sceneSummary: "Families United, Together & Grateful",
        dialogues: [
          { author: "Narrator", text: "CHAMPIONSHIP VICTORY ROAD: Both Josh & Gabby are now 19, turning 20 years old!" },
          { author: "Josh", text: "2026 has been our craziest year yet. We finally got to see each other so much and just live like a normal couple." },
          { author: "Josh", text: "Our families know each other closely now. From a chubby boy praying in church in Kerala to standing right beside you today." },
          { author: "Josh", text: "Gabriella George, thank you for loving me, forgiving me, and choosing me every day. Happy Anniversary, my girl." },
          { author: "Josh", text: "QUEST COMPLETE: I LOVE YOU FOREVER AND ALWAYS, GABBY! ♥" }
        ]
      }
    ];

    /* =====================================================================
       4. GAME STATE ENGINE
       ===================================================================== */
    let currentView = "title"; // 'title' | 'hub' | 'story'
    let currentChapterIndex = 0;
    let currentDialogueIndex = 0;
    let isTyping = false;
    let typeTimer = null;

    // DOM Elements
    const titleView = document.getElementById("title-view");
    const hubView = document.getElementById("hub-view");
    const storyView = document.getElementById("story-view");
    const chapterListContainer = document.getElementById("chapterListContainer");
    const dialogueAuthor = document.getElementById("dialogueAuthor");
    const dialogueText = document.getElementById("dialogueText");
    const dialoguePrompt = document.getElementById("dialoguePrompt");
    const sceneBanner = document.getElementById("sceneBanner");
    const heartFxZone = document.getElementById("heartFxZone");

    // Initialize Hub Stage List
    function populateChapterList() {
      chapterListContainer.innerHTML = "";
      STORY_CHAPTERS.forEach((ch, idx) => {
        const card = document.createElement("div");
        card.className = `chapter-card ${idx === currentChapterIndex ? 'selected' : ''}`;
        card.innerHTML = `
          <div>
            <div style="font-weight:bold;">${ch.badge} ${ch.title}</div>
            <div style="font-size:6px; opacity:0.8; margin-top:2px;">${ch.sceneSummary}</div>
          </div>
          <div class="badge-icon">▶</div>
        `;
        card.onclick = () => {
          currentChapterIndex = idx;
          updateChapterListSelection();
          startStoryStage(idx);
        };
        chapterListContainer.appendChild(card);
      });
    }

    function updateChapterListSelection() {
      const cards = chapterListContainer.children;
      for (let i = 0; i < cards.length; i++) {
        if (i === currentChapterIndex) {
          cards[i].classList.add("selected");
          cards[i].scrollIntoView({ block: 'nearest' });
        } else {
          cards[i].classList.remove("selected");
        }
      }
    }

    function switchView(viewName) {
      currentView = viewName;
      titleView.classList.remove("active");
      hubView.classList.remove("active");
      storyView.classList.remove("active");

      if (viewName === "title") titleView.classList.add("active");
      if (viewName === "hub") {
        hubView.classList.add("active");
        populateChapterList();
      }
      if (viewName === "story") storyView.classList.add("active");
    }

    /* Start an interactive chapter */
    function startStoryStage(stageIdx) {
      currentChapterIndex = stageIdx;
      currentDialogueIndex = 0;
      switchView("story");

      const ch = STORY_CHAPTERS[stageIdx];
      sceneBanner.innerText = `${ch.badge} ${ch.location}`;

      // Mood updates for sprites
      renderJoshSprite("stageJoshCanvas", stageIdx === 0 ? "inLove" : "normal");
      renderGabbySprite("stageGabbyCanvas", stageIdx === 4 ? "inLove" : "normal");

      spawnFloatingHeart();
      displayDialogue();
    }

    /* Dialogue typewriter effect */
    function displayDialogue() {
      const ch = STORY_CHAPTERS[currentChapterIndex];
      const dialogue = ch.dialogues[currentDialogueIndex];
      
      dialogueAuthor.innerText = dialogue.author;
      dialogueText.innerText = "";
      isTyping = true;
      dialoguePrompt.innerText = "▶";

      if (dialogue.author === "Josh") {
        dialogueAuthor.style.color = "#dc2626";
      } else if (dialogue.author === "Gabby") {
        dialogueAuthor.style.color = "#ec4899";
      } else {
        dialogueAuthor.style.color = "#4b5563";
      }

      let charIndex = 0;
      clearInterval(typeTimer);

      typeTimer = setInterval(() => {
        if (charIndex < dialogue.text.length) {
          dialogueText.innerText += dialogue.text[charIndex];
          if (charIndex % 2 === 0) playTextTick();
          charIndex++;
        } else {
          clearInterval(typeTimer);
          isTyping = false;
          dialoguePrompt.innerText = "▼ A: NEXT";
        }
      }, 25);
    }

    /* Advance or Skip Text */
    function advanceDialogue() {
      const ch = STORY_CHAPTERS[currentChapterIndex];

      if (isTyping) {
        // Fast-forward text
        clearInterval(typeTimer);
        dialogueText.innerText = ch.dialogues[currentDialogueIndex].text;
        isTyping = false;
        dialoguePrompt.innerText = "▼ A: NEXT";
        return;
      }

      playSelectSound();
      currentDialogueIndex++;

      if (currentDialogueIndex < ch.dialogues.length) {
        displayDialogue();
        if (Math.random() > 0.4) spawnFloatingHeart();
      } else {
        // Stage completed
        playFanfare();
        triggerConfettiHearts();
        
        if (currentChapterIndex < STORY_CHAPTERS.length - 1) {
          setTimeout(() => {
            currentChapterIndex++;
            startStoryStage(currentChapterIndex);
          }, 1100);
        } else {
          // Finished entire journey
          setTimeout(() => {
            switchView("hub");
          }, 1500);
        }
      }
    }

    /* Visual Particle / Hearts FX */
    function spawnFloatingHeart() {
      const heart = document.createElement("div");
      heart.className = "heart-float";
      heart.innerText = "♥";
      heart.style.left = `${Math.floor(Math.random() * 80) + 10}%`;
      heart.style.bottom = "40px";
      heartFxZone.appendChild(heart);
      setTimeout(() => heart.remove(), 1200);
    }

    function triggerConfettiHearts() {
      for (let i = 0; i < 18; i++) {
        const h = document.createElement("div");
        h.className = "heart-burst";
        h.innerText = Math.random() > 0.5 ? "♥" : "★";
        h.style.color = Math.random() > 0.5 ? "#ef4444" : "#f59e0b";
        h.style.left = "50%";
        h.style.top = "40%";
        const dx = (Math.random() - 0.5) * 200 + "px";
        const dy = (Math.random() - 0.5) * 180 + "px";
        h.style.setProperty("--dx", dx);
        h.style.setProperty("--dy", dy);
        heartFxZone.appendChild(h);
        setTimeout(() => h.remove(), 1000);
      }
    }

    /* =====================================================================
       5. USER INPUT HANDLERS (D-PAD & BUTTONS)
       ===================================================================== */
    function handlePressA() {
      initAudio();
      playSelectSound();
      if (currentView === "title") {
        switchView("hub");
      } else if (currentView === "hub") {
        startStoryStage(currentChapterIndex);
      } else if (currentView === "story") {
        advanceDialogue();
      }
    }

    function handlePressB() {
      initAudio();
      playBeep(240, "square", 0.08);
      if (currentView === "story") {
        switchView("hub");
      } else if (currentView === "hub") {
        switchView("title");
      }
    }

    function handleUp() {
      playBeep(400, "sine", 0.04);
      if (currentView === "hub") {
        if (currentChapterIndex > 0) {
          currentChapterIndex--;
          updateChapterListSelection();
        }
      }
    }

    function handleDown() {
      playBeep(400, "sine", 0.04);
      if (currentView === "hub") {
        if (currentChapterIndex < STORY_CHAPTERS.length - 1) {
          currentChapterIndex++;
          updateChapterListSelection();
        }
      }
    }

    // Attach Event Listeners to Screen / Touch Buttons
    const bindBtn = (id, action) => {
      const el = document.getElementById(id);
      if (!el) return;
      
      const fire = (e) => {
        e.preventDefault();
        el.classList.add("pressed");
        action();
        setTimeout(() => el.classList.remove("pressed"), 120);
      };

      el.addEventListener("pointerdown", fire);
    };

    bindBtn("btnA", handlePressA);
    bindBtn("btnB", handlePressB);
    bindBtn("btnStart", handlePressA);
    bindBtn("btnSelect", handlePressB);
    bindBtn("btnUp", handleUp);
    bindBtn("btnDown", handleDown);
    bindBtn("btnLeft", () => handleUp());
    bindBtn("btnRight", () => handleDown());

    // Allow screen tap to continue on dialogue
    document.getElementById("story-view").addEventListener("click", () => {
      if (currentView === "story") advanceDialogue();
    });

    // Keyboard support for testing (Arrow Keys, Z/Enter = A, X/Esc = B)
    window.addEventListener("keydown", (e) => {
      if (["ArrowUp", "KeyW"].includes(e.code)) handleUp();
      if (["ArrowDown", "KeyS"].includes(e.code)) handleDown();
      if (["KeyZ", "Enter", "Space"].includes(e.code)) handlePressA();
      if (["KeyX", "Escape", "Backspace"].includes(e.code)) handlePressB();
    });

    /* =====================================================================
       6. BOOTSTRAP INITIAL SPRITES & RUNTIME
       ===================================================================== */
    window.addEventListener("DOMContentLoaded", () => {
      renderJoshSprite("joshTitleCanvas", "inLove");
      renderGabbySprite("gabbyTitleCanvas", "inLove");
      renderJoshSprite("stageJoshCanvas");
      renderGabbySprite("stageGabbyCanvas");
      populateChapterList();

      // Battery LED subtle flicker simulation
      setInterval(() => {
        const led = document.getElementById("powerLed");
        if (led) led.style.opacity = (0.85 + Math.random() * 0.15).toFixed(2);
      }, 400);
    });
  </script>
</body>
</html>
